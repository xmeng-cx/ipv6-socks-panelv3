services:
  ipv6-socks-panel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        XRAY_IMAGE: ${XRAY_IMAGE:-ghcr.io/xtls/xray-core:26.5.9}
        GO_IMAGE: ${GO_IMAGE:-golang:1.25-alpine}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.22}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: ipv6-socks-panel:local
    container_name: ipv6-socks-panel
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    env_file:
      - .env
    volumes:
      - ./data:/data
    stop_grace_period: 20s
